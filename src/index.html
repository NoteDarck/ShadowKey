<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShadowKey</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #1a1a1a; color: #eee; }
        input, button { padding: 8px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        button { cursor: pointer; background: #3b82f6; color: white; border: none; border-radius: 4px; }
        .section { border: 1px solid #333; padding: 15px; margin-bottom: 15px; border-radius: 8px; }
        #log { white-space: pre-wrap; background: #000; padding: 10px; font-size: 12px; }
    </style>
</head>
<body>
    <h1>ShadowKey</h1>

    <div class="section">
        <h3>1. Selecionar arquivo do cofre</h3>
        <button id="btn-select">Selecionar arquivo do pendrive (.vault)</button>
        <p id="file-path" style="font-size:12px; color:#aaa;">Nenhum arquivo selecionado</p>
    </div>

    <div class="section">
        <h3>2. Senha mestra</h3>
        <input type="password" id="master-pass" placeholder="Digite a senha mestra" />
        <button id="btn-unlock">Desbloquear e listar</button>
        <button id="btn-create" style="background:#22c55e;">Criar novo cofre neste arquivo</button>
    </div>

    <div class="section">
        <h3>3. Adicionar senha</h3>
        <input type="text" id="service" placeholder="Serviço (ex: Gmail)" />
        <input type="text" id="username" placeholder="Usuário" />
        <input type="password" id="password" placeholder="Senha" />
        <button id="btn-add">Adicionar ao cofre</button>
    </div>

    <div class="section">
        <h3>Entradas no cofre</h3>
        <div id="entries">Nenhuma entrada carregada.</div>
    </div>

    <div id="log"></div>

    <script type="module" src="/main.js"></script>
</body>
</html>
